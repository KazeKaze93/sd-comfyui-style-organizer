name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pytest
        run: pip install pytest
      - name: Run pytest
        run: python -m pytest tests/ -v

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm test
      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Typecheck node
        run: npx tsc --noEmit -p tsconfig.node.json
      - name: Typecheck test
        run: npx tsc --noEmit -p tsconfig.test.json
      - name: Run eslint
        run: npm run lint

  # Committed web/ui must match a clean Vite build from ui/ (no stale panel assets).
  # Build on ubuntu with the pinned Node from .nvmrc; Windows-local hashes can differ.
  ui-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Build UI into web/ui
        working-directory: ui
        run: npm run build
      - name: Normalize EOL before diff
        run: |
          git add --renormalize web/ui
          git status --short -- web/ui
      - name: Fail if committed web/ui differs from build output
        id: check
        run: |
          if ! git diff --exit-code -- web/ui; then
            echo "::error::web/ui is out of date vs ubuntu/Node from .nvmrc. Download the web-ui-built artifact, replace web/ui, and commit."
            git status --short -- web/ui
            exit 1
          fi
          echo "web/ui matches vite build."
      - name: Upload Linux build for commit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-built
          path: web/ui
